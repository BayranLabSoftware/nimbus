name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        # The exact version in .nvmrc, not a major: the impacts seal is a
        # digest to the bit, and ICU's formatting and V8's last bit move
        # between Node releases (rule 836 of impactSealRules.ts). Moving it is
        # a re-seal with that as its reason.
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test -- --coverage

      - name: Validation gate (strict)
        # The strict gate (closes H7) runs the V&V replay corpus + the
        # executable golden dataset and writes docs/VALIDATION_REPORT.md
        # plus a machine-readable JSON sidecar. It exits 1 if any
        # fixture or golden case fails — see `scripts/generate-validation-report.ts`
        # `gate()` for the policy. Keep this AFTER `pnpm test` so the
        # underlying assertions have already passed individually; this
        # step is the cumulative regression gate.
        run: pnpm validation-report -- --mode=strict

      - name: Validation report is current
        # The step above rewrites docs/VALIDATION_REPORT.* from the code
        # in this commit. If that changed a byte, the committed report
        # describes a model that no longer exists — and every simulation
        # report the application prints links to the committed copy for
        # the commit that built it.
        #
        # This is the step that was missing: the gate above has run on
        # every push since April, and the report in the repository sat
        # frozen at 30 April 2026 for four months, because the
        # regenerated copy only ever went into a throwaway artifact.
        run: |
          if ! git diff --exit-code -- docs/VALIDATION_REPORT.md docs/VALIDATION_REPORT.json; then
            echo "::error file=docs/VALIDATION_REPORT.md::The committed validation report does not match the model in this commit. Run 'pnpm validation-report' and commit docs/VALIDATION_REPORT.md and docs/VALIDATION_REPORT.json."
            exit 1
          fi

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: |
            docs/VALIDATION_REPORT.md
            docs/VALIDATION_REPORT.json
          retention-days: 30

      - name: Build
        run: pnpm build

      - name: Bundle size budget
        run: pnpm bundle:size

      - name: Build Storybook
        run: pnpm build-storybook --quiet

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
