# Publishes the built simulator to GitHub Pages on every push to main
# that passes CI.
#
# The repository ships a Cloudflare Pages workflow too (deploy.yml),
# gated behind ENABLE_CF_DEPLOY. The two are alternatives, not rivals:
# Cloudflare gives a root domain and works from a private repository,
# Pages needs neither an account nor a token. Leave the Cloudflare
# variable unset and this one is the live site.
name: Pages

on:
  # After CI, not beside it: a commit whose unit tests or validation
  # gate fail never reaches the live site, where every simulation
  # report links to the validation report of the commit it was built
  # from. CI takes about two minutes, so the wait costs little.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time, and never cancel one half-way: an interrupted
# deploy leaves the site serving a partial build.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The commit CI passed, not wherever main points by the time this
      # run starts.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # pnpm before setup-node: the cache resolver shells out to
      # `pnpm store path`, and with only `corepack enable` the shim is
      # registered but the binary is not yet provisioned, so the step
      # fails before a single dependency is fetched.
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          # Project sites live under /<repo>/, so the bundle needs the
          # sub-path baked into its asset URLs.
          BASE_PATH: /${{ github.event.repository.name }}/
        # On a workflow_run event GITHUB_SHA is main's head when the run
        # starts, which a later push can move past the commit checked
        # out above; the bundle is stamped with the commit it is built
        # from (vite.config.ts, buildCommit).
        run: GITHUB_SHA="$(git rev-parse HEAD)" pnpm build

      # One manual step precedes the first run of this workflow:
      # Settings -> Pages -> Build and deployment -> Source:
      # "GitHub Actions". The workflow token cannot do it — creating a
      # Pages site through the API answers "Resource not accessible by
      # integration" — so `enablement: true` only turns a clear
      # configuration error into a confusing permissions one.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
