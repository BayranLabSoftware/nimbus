<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nimbus — banco di prova renderer d'impatto</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: #04050a;
        color: #e4e9f0;
        font:
          13px/1.45 system-ui,
          sans-serif;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: grab;
      }
      canvas:active {
        cursor: grabbing;
      }
      .bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        gap: 14px;
        align-items: center;
        padding: 12px 18px;
        background: linear-gradient(180deg, transparent, rgba(4, 5, 10, 0.9) 45%);
      }
      button {
        background: #141a24;
        color: #e4e9f0;
        border: 1px solid #33404f;
        border-radius: 3px;
        padding: 6px 12px;
        cursor: pointer;
        font: inherit;
      }
      button[aria-pressed='true'] {
        background: #ff7a2f;
        color: #150800;
        border-color: #ff7a2f;
      }
      input[type='range'] {
        flex: 1;
      }
      .top {
        position: fixed;
        top: 12px;
        left: 18px;
        right: 18px;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      #status,
      #readout {
        font-family: ui-monospace, monospace;
        font-size: 11px;
        color: #8a97a8;
      }
      #readout {
        margin-left: auto;
      }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <div class="top">
      <button data-site="0" aria-pressed="true">1 Mt · Yucca Flat</button>
      <button data-site="1" aria-pressed="false">Meteor Crater</button>
      <button data-site="2" aria-pressed="false">Chicxulub</button>
      <span id="status">…</span>
    </div>
    <div class="bar">
      <button id="play">play / pausa</button>
      <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Tempo" />
      <span id="readout">—</span>
    </div>
    <script type="module" src="/src/scene/impact/devHarness.ts"></script>
  </body>
</html>
